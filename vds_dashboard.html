<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive VDS Rate Chart</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables CSS -->
    <link href="https://cdn.jsdelivr.net/npm/datatables.net-bs5@1.13.4/dist/dataTables.bootstrap5.min.css" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-radius: 10px; margin-bottom: 24px; }
        .card-header { background-color: #fff; border-bottom: 1px solid #efefef; font-weight: 600; font-size: 1.1rem; }
        .table th { background-color: #f1f3f5; color: #495057; font-weight: 600; }
        .vds-badge { font-weight: 600; padding: 0.4em 0.75em; border-radius: 4px; }
        .rate-15 { background-color: #f8d7da; color: #842029; }
        .rate-10 { background-color: #fff3cd; color: #664d03; }
        .rate-5 { background-color: #cff4fc; color: #055160; }
        .rate-other { background-color: #d1e7dd; color: #0f5132; }
        .hero-section { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 40px 0; margin-bottom: 30px; border-radius: 0 0 15px 15px; }
    </style>
</head>
<body>

<div class="hero-section shadow-sm">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-8">
                <h1 class="fw-bold"><i class="fa-solid fa-calculator me-2"></i> Interactive VDS Rate Chart</h1>
                <p class="lead mb-0">VAT Deducted at Source (VDS) Rates on Procurement of Services</p>
            </div>
            <div class="col-md-4 text-md-end mt-3 mt-md-0">
                <span class="badge bg-light text-dark fs-6 py-2 px-3 shadow-sm">Total Services: 50</span>
            </div>
        </div>
    </div>
</div>

<div class="container">
    <!-- Calculator Row -->
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <i class="fa-solid fa-wand-magic-sparkles me-2"></i> Quick VDS Calculator
                </div>
                <div class="card-body">
                    <div class="row g-3 align-items-center">
                        <div class="col-md-4">
                            <label for="calcService" class="form-label fw-semibold">Select Service</label>
                            <select id="calcService" class="form-select">
                                <option value="" selected disabled>Choose a service...</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="invoiceAmount" class="form-label fw-semibold">Invoice Amount</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" id="invoiceAmount" class="form-control" placeholder="e.g. 10000" min="0">
                            </div>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-semibold">VDS Rate</label>
                            <div id="calcRateDisplay" class="form-control bg-light fw-bold text-center">-</div>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold text-primary">VDS to Deduct</label>
                            <div id="calcVDSDisplay" class="form-control bg-dark text-warning fw-bold text-center fs-5">-</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Table Row -->
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <i class="fa-solid fa-list-check me-2"></i> Service Directory & Rates
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table id="vdsTable" class="table table-striped table-hover align-middle width-100" style="width:100%">
                            <thead>
                                <tr>
                                    <th style="width: 8%">Sl. No.</th>
                                    <th style="width: 15%">Service Code</th>
                                    <th>Description of Goods & Services</th>
                                    <th style="width: 15%" class="text-center">VDS Rate (%)</th>
                                </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/datatables.net/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/datatables.net-bs5@1.13.4/dist/dataTables.bootstrap5.min.js"></script>

<script>
    // Embedded JSON Data
    const vdsData = [{"sl_no": 1, "service_code": "S001.10", "description": "Air-conditioned hotel", "vds_rate": 15.0}, {"sl_no": 1, "service_code": "S001.10", "description": "Non-air-conditioned hotel", "vds_rate": 10.0}, {"sl_no": 1, "service_code": "S001.20", "description": "Restaurant except restaurant situated in three-star or above category residential hotel listed by Ministry of Civil Aviation and Tourism", "vds_rate": 5.0}, {"sl_no": 2, "service_code": "S002.00", "description": "Decorators and caterers", "vds_rate": 15.0}, {"sl_no": 3, "service_code": "S003.10", "description": "Motor vehicles garage and workshop", "vds_rate": 10.0}, {"sl_no": 4, "service_code": "S003.20", "description": "Dockyard", "vds_rate": 15.0}, {"sl_no": 5, "service_code": "S004.00", "description": "Construction contractor", "vds_rate": 10.0}, {"sl_no": 6, "service_code": "S007.00", "description": "Advertisement agency", "vds_rate": 15.0}, {"sl_no": 7, "service_code": "S008.10", "description": "Printing press", "vds_rate": 15.0}, {"sl_no": 8, "service_code": "S009.00", "description": "Auctioneers", "vds_rate": 15.0}, {"sl_no": 9, "service_code": "S010.10", "description": "Land development organisation", "vds_rate": 2.0}, {"sl_no": 10, "service_code": "S010.20", "description": "Building construction organisation: (i) 1-1,600 square feet", "vds_rate": 2.0}, {"sl_no": 10, "service_code": "S010.20", "description": "Building construction organisation: (ii) More than 1,600 square feet", "vds_rate": 4.5}, {"sl_no": 10, "service_code": "S010.20", "description": "Building construction organisation: (iii) Re-registration of all sizes", "vds_rate": 2.0}, {"sl_no": 11, "service_code": "S014.00", "description": "Indenting organisation", "vds_rate": 15.0}, {"sl_no": 12, "service_code": "S015.10", "description": "Freight forwarders", "vds_rate": 15.0}, {"sl_no": 13, "service_code": "S017.00", "description": "Community centre", "vds_rate": 15.0}, {"sl_no": 14, "service_code": "S020.00", "description": "Survey organisation", "vds_rate": 15.0}, {"sl_no": 15, "service_code": "S021.00", "description": "Plant or capital machinery renting organisation", "vds_rate": 15.0}, {"sl_no": 16, "service_code": "S024.00", "description": "Furniture sales centre: Manufacturing stage (if supply made from manufacturer to ultimate customer, then the VAT rate would be 15%)", "vds_rate": 7.5}, {"sl_no": 16, "service_code": "S024.00", "description": "Furniture sales centre: Selling stage (showroom) provided Mushak for payment of VAT at 7.5% at manufacturing stage is available; otherwise, 15%.", "vds_rate": 7.5}, {"sl_no": 17, "service_code": "S028.00", "description": "Courier and express mail service", "vds_rate": 15.0}, {"sl_no": 18, "service_code": "S031.00", "description": "Repairing or servicing of taxable goods in exchange of consideration", "vds_rate": 15.0}, {"sl_no": 19, "service_code": "S032.00", "description": "Consultancy and supervisory firm", "vds_rate": 15.0}, {"sl_no": 20, "service_code": "S033.00", "description": "Lessee", "vds_rate": 15.0}, {"sl_no": 21, "service_code": "S034.00", "description": "Audit and accounting firm", "vds_rate": 15.0}, {"sl_no": 22, "service_code": "S037.00", "description": "Procurement provider", "vds_rate": 10.0}, {"sl_no": 23, "service_code": "S040.00", "description": "Security services", "vds_rate": 15.0}, {"sl_no": 24, "service_code": "S043.00", "description": "Television and online program producer", "vds_rate": 15.0}, {"sl_no": 25, "service_code": "S045.00", "description": "Legal advisor", "vds_rate": 15.0}, {"sl_no": 26, "service_code": "S048.00", "description": "Transport contractor (petroleum goods)", "vds_rate": 5.0}, {"sl_no": 26, "service_code": "S048.00", "description": "Transport contractor (except petroleum goods)", "vds_rate": 15.0}, {"sl_no": 27, "service_code": "S049.00", "description": "Vehicle renting service provider", "vds_rate": 15.0}, {"sl_no": 28, "service_code": "S050.10", "description": "Architect, interior designer, or interior decorator", "vds_rate": 15.0}, {"sl_no": 29, "service_code": "S050.20", "description": "Graphic designer", "vds_rate": 15.0}, {"sl_no": 30, "service_code": "S051.00", "description": "Engineering firm", "vds_rate": 15.0}, {"sl_no": 31, "service_code": "S052.00", "description": "Sound and lighting equipment renting service provider", "vds_rate": 15.0}, {"sl_no": 32, "service_code": "S053.00", "description": "Participants in board meetings", "vds_rate": 15.0}, {"sl_no": 33, "service_code": "S054.00", "description": "Advertisement telecaster through satellite channel", "vds_rate": 15.0}, {"sl_no": 34, "service_code": "S058.00", "description": "Chartered airlines or helicopter renting organisation", "vds_rate": 15.0}, {"sl_no": 35, "service_code": "S060.00", "description": "Purchaser of auctioned goods", "vds_rate": 15.0}, {"sl_no": 36, "service_code": "S065.00", "description": "Clearing and maintaining agencies of building, floor, and premises", "vds_rate": 15.0}, {"sl_no": 37, "service_code": "S066.00", "description": "Lottery ticket seller", "vds_rate": 15.0}, {"sl_no": 38, "service_code": "S067.00", "description": "Immigration advisor", "vds_rate": 15.0}, {"sl_no": 39, "service_code": "S071.00", "description": "Event organiser", "vds_rate": 15.0}, {"sl_no": 40, "service_code": "S072.00", "description": "Manpower service provider", "vds_rate": 15.0}, {"sl_no": 41, "service_code": "S099.10", "description": "Information technology enabled services", "vds_rate": 5.0}, {"sl_no": 42, "service_code": "S099.20", "description": "Miscellaneous service", "vds_rate": 15.0}, {"sl_no": 43, "service_code": "S099.30", "description": "Sponsorship service", "vds_rate": 15.0}, {"sl_no": 44, "service_code": "S099.50", "description": "Credit rating agency", "vds_rate": 15.0}];

    $(document).ready(function() {
        // Populate Table
        const tableBody = $('#vdsTable tbody');
        const calcSelect = $('#calcService');

        vdsData.forEach((item, index) => {
            // Determine badge class based on rate
            let badgeClass = 'rate-other';
            if (item.vds_rate === 15.0) badgeClass = 'rate-15';
            else if (item.vds_rate === 10.0) badgeClass = 'rate-10';
            else if (item.vds_rate === 5.0) badgeClass = 'rate-5';

            const row = `<tr>
                <td>${item.sl_no}</td>
                <td><code class="fw-bold text-dark">${item.service_code}</code></td>
                <td>${item.description}</td>
                <td class="text-center"><span class="vds-badge ${badgeClass}">${item.vds_rate.toFixed(1)}%</span></td>
            </tr>`;
            tableBody.append(row);

            // Populate Calculator Select options
            // Limit text length for option display
            let shortDesc = item.description;
            if (shortDesc.length > 60) shortDesc = shortDesc.substring(0, 57) + '...';
            calcSelect.append(`<option value="${index}">[${item.service_code}] ${shortDesc}</option>`);
        });

        // Initialize DataTable
        $('#vdsTable').DataTable({
            "pageLength": 15,
            "lengthMenu": [10, 15, 25, 50, 100],
            "order": [[0, "asc"]],
            "language": {
                "searchPlaceholder": "Search code or service...",
                "search": "<i class='fa fa-search'></i> Filter:"
            }
        });

        // Calculator Logic
        function calculateVDS() {
            const selectedIdx = calcSelect.val();
            const amount = parseFloat($('#invoiceAmount').val());

            if (selectedIdx !== null && !isNaN(amount) && amount >= 0) {
                const rate = vdsData[selectedIdx].vds_rate;
                const vdsAmount = (amount * rate) / 100;
                
                $('#calcRateDisplay').text(rate.toFixed(1) + '%');
                $('#calcVDSDisplay').text(vdsAmount.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}));
            } else if (selectedIdx !== null) {
                const rate = vdsData[selectedIdx].vds_rate;
                $('#calcRateDisplay').text(rate.toFixed(1) + '%');
                $('#calcVDSDisplay').text('-');
            } else {
                $('#calcRateDisplay').text('-');
                $('#calcVDSDisplay').text('-');
            }
        }

        calcSelect.on('change', calculateVDS);
        $('#invoiceAmount').on('input', calculateVDS);
    });
</script>
</body>
</html>
